<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir</title>
</head>
<body>
    <h1>Sistem Kasir Toko Buku</h1>

    <div>
        <p>Nama Buku: <span id="namaBuku"></span></p>
        <p>Harga Satuan: <span id="hargaSatuan"></span></p>
        <p>Jumlah Beli: <span id="jumlahBeli"></span></p>
        <p>Total Harga (sebelum diskon): <span id="totalHarga"></span></p>
        <p>Diskon: <span id="diskon"></span></p>
        <p>Total Bayar (setelah diskon): <span id="totalBayar"></span></p>
        <p>Status Bonus: <span id="statusBonus"></span></p>

        <button onclick="prosesTransaksi()">Proses Transaksi</button>
    </div>

    <script src="script.js" defer></script>
