<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sewa Kendaraan</title>
</head>

<body>
    <h1>Sistem Kalkulator Sewa Kendaraan</h1>

    <div class="container">
        <p>Nama Pelanggan: <span id="namaPelanggan"></span></p>
        <p>Jenis Mobil: <span id="jenisMobil"></span></p>
        <p>Harga Sewa: <span id="hargaSewa"></span></p>
        <p>Durasi (Hari): <span id="durasi"></span></p>
        <p>Total Biaya: <span id="totalBiaya"></span></p>
        <p>Diskon: <span id="diskon"></span></p>
        <p>Total Bayar: <span id="totalBayar"></span></p>
        <p>Status Bonus: <span id="statusBonus"></span></p>

        <button onclick="prosesSewa">Proses Sewa</button>
    </div>

    <script src="script.js" defer></script>
</body>

</html>
